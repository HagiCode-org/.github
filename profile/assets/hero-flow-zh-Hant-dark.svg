<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360" role="img" aria-labelledby="t d">
  <title id="t">HagiCode 工作流程：你的 Agent CLI、HagiCode 工作台、你的模型</title>
  <desc id="d">Claude Code、Codex、GitHub Copilot、OpenCode 等 Agent CLI 接入 HagiCode 工作台。一項任務依序經過四個階段：理解、劃定範圍、執行、回看。OmniRoute 負責路由模型與端點。</desc>
  <style>
    text{font-family:-apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", "Noto Sans", sans-serif}
    .h{font-size:17px;font-weight:600;fill:#CBD5E1}
    .t{font-size:17px;font-weight:600;fill:#F8FAFC}
    .s{font-size:21px;font-weight:700;fill:#F8FAFC}
    .d{font-size:16.5px;fill:#CBD5E1}
    .n{font-size:15px;font-weight:700;fill:#030712}
    .ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 7s cubic-bezier(.22,1,.36,1) infinite}
    @keyframes pulse{0%{opacity:.85;transform:scale(1)}16%{opacity:0;transform:scale(2.1)}100%{opacity:0;transform:scale(2.1)}}
    @media (prefers-reduced-motion:reduce){.ring{animation:none}}
  </style>
  <rect width="740" height="360" rx="16" fill="#0A0F1E"/>

  <text x="20" y="54" class="h">你現有的 Agent CLI</text>
  <rect x="20" y="78" width="152" height="42" rx="10" fill="#151E32" stroke="#334155" stroke-width="1.5"/><text x="34" y="105" class="t">Claude Code</text>
  <rect x="20" y="132" width="152" height="42" rx="10" fill="#151E32" stroke="#334155" stroke-width="1.5"/><text x="34" y="159" class="t">Codex</text>
  <rect x="20" y="186" width="152" height="42" rx="10" fill="#151E32" stroke="#334155" stroke-width="1.5"/><text x="34" y="213" class="t">GitHub Copilot</text>
  <rect x="20" y="240" width="152" height="42" rx="10" fill="#151E32" stroke="#334155" stroke-width="1.5"/><text x="34" y="267" class="t">OpenCode</text>
  <text x="34" y="314" class="d">以及更多</text>
  <path d="M180 180H214" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/><path d="M208 173L218 180L208 187" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="226" y="20" width="312" height="320" rx="16" fill="#151E32" stroke="#00D4FF" stroke-width="2"/>
  <text x="248" y="62" class="s" style="font-size:25px">HagiCode <tspan style="font-weight:500;fill:#CBD5E1;font-size:18px">工作台</tspan></text>
  <path d="M262 106V292" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <circle class="ring" style="animation-delay:0.0s" cx="262" cy="106" r="14" fill="none" stroke="#00D4FF" stroke-width="2.5"/>
  <circle cx="262" cy="106" r="14" fill="#00A3FF"/><text x="262" y="111.5" text-anchor="middle" class="n">1</text>
  <text x="290" y="105" class="s">先理解</text><text x="290" y="126" class="d">唯讀工作階段</text>
  <circle class="ring" style="animation-delay:1.3s" cx="262" cy="168" r="14" fill="none" stroke="#00D4FF" stroke-width="2.5"/>
  <circle cx="262" cy="168" r="14" fill="#00A3FF"/><text x="262" y="173.5" text-anchor="middle" class="n">2</text>
  <text x="290" y="167" class="s">再定範圍</text><text x="290" y="188" class="d">提案：目標、任務、驗證</text>
  <circle class="ring" style="animation-delay:2.6s" cx="262" cy="230" r="14" fill="none" stroke="#00D4FF" stroke-width="2.5"/>
  <circle cx="262" cy="230" r="14" fill="#00A3FF"/><text x="262" y="235.5" text-anchor="middle" class="n">3</text>
  <text x="290" y="229" class="s">後執行</text><text x="290" y="250" class="d">需要時才切換編輯模式</text>
  <circle class="ring" style="animation-delay:3.9s" cx="262" cy="292" r="14" fill="none" stroke="#00D4FF" stroke-width="2.5"/>
  <circle cx="262" cy="292" r="14" fill="#00A3FF"/><text x="262" y="297.5" text-anchor="middle" class="n">4</text>
  <text x="290" y="291" class="s">可回看</text><text x="290" y="312" class="d">工作階段紀錄與 AI 提交</text>
  <path d="M546 180H576" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/><path d="M570 173L580 180L570 187" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="588" y="54" class="h">你的模型</text>
  <rect x="588" y="114" width="132" height="132" rx="12" fill="#151E32" stroke="#A78BFA" stroke-width="2"/>
  <text x="602" y="148" class="t" style="font-size:16px;font-weight:700">OmniRoute</text>
  <text x="602" y="176" class="d">路由模型</text><text x="602" y="198" class="d">與端點</text><text x="602" y="220" class="d"></text>
</svg>
